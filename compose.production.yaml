services:
  db:
    extends:
      file: compose.base.yaml
      service: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

  backend:
    extends:
      file: compose.base.yaml
      service: backend
    ports:
      - "8080:8080"
    env_file:
      - ./envs/.env.production
    depends_on:
      - db
      - ollama
    restart: always

  frontend:
    extends:
      file: compose.base.yaml
      service: frontend
    build:
      context: ../scriptium-frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - DATABASE_URL=${DATABASE_URL}
    ports:
      - "3000:3000"
    env_file:
      - ./envs/.env.production
    volumes:
      - ../scriptium-frontend/prisma/dev.db:/app/prisma/dev.db
    depends_on:
      - backend
    restart: always


